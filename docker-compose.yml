version: '3.8'

services:
  # MySQL 数据库（仅在未使用外部 RDS 时启用）
  mysql:
    image: docker.aityp.com/mysql:8.0
    container_name: ttssreport-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ttssreport
      MYSQL_USER: ttssuser
      MYSQL_PASSWORD: ttsspassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端 API (FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: immarkfu/ttssreport-backend:latest
    container_name: ttssreport-backend
    restart: unless-stopped
    environment:
      # 数据库配置（支持 DB_* 和 DATABASE_* 两种命名）
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-ttssuser}
      - DB_PASSWORD=${DB_PASSWORD:-ttsspassword}
      - DB_NAME=${DB_NAME:-ttssreport}
      # 兼容旧版 DATABASE_* 命名
      - DATABASE_HOST=${DATABASE_HOST:-}
      - DATABASE_PORT=${DATABASE_PORT:-}
      - DATABASE_USER=${DATABASE_USER:-}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-}
      - DATABASE_NAME=${DATABASE_NAME:-}
      # Tushare
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:-}
      # JWT
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-ttssreport_jwt_secret_change_in_production}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-1440}
      # 火山云短信
      - VOLCENGINE_SMS_ACCESS_KEY=${VOLCENGINE_SMS_ACCESS_KEY:-}
      - VOLCENGINE_SMS_SECRET_KEY=${VOLCENGINE_SMS_SECRET_KEY:-}
      - VOLCENGINE_SMS_SIGN_NAME=${VOLCENGINE_SMS_SIGN_NAME:-}
      - VOLCENGINE_SMS_TEMPLATE_ID=${VOLCENGINE_SMS_TEMPLATE_ID:-}
      - VOLCENGINE_SMS_ENDPOINT=${VOLCENGINE_SMS_ENDPOINT:-https://sms.volcengineapi.com}
      - VOLCENGINE_SMS_REGION=${VOLCENGINE_SMS_REGION:-cn-north-1}
    ports:
      - "8000:8000"
    volumes:
      - backend_logs:/app/logs

  # 前端 (React + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: immarkfu/ttssreport-frontend:latest
    container_name: ttssreport-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
    driver: local
  backend_logs:
    driver: local

networks:
  default:
    name: ttssreport-network
