name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  # ─── 前端构建检查 ────────────────────────────────────────────────
  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (with Taobao registry)
        run: pnpm install --frozen-lockfile --registry https://registry.npmmirror.com

      - name: Type check
        run: pnpm run check

      - name: Build
        run: pnpm run build

  # ─── 后端依赖检查 ────────────────────────────────────────────────
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (with Aliyun mirror)
        run: |
          pip install --no-cache-dir \
            -i https://mirrors.aliyun.com/pypi/simple/ \
            --trusted-host mirrors.aliyun.com \
            -r requirements.txt

      - name: Run tests
        run: pytest test/ -v || echo "No tests found, skipping"
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

  # ─── SSH 部署到现网服务器（在服务器本地构建镜像）─────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Package and transfer code to server
        run: |
          # 打包代码（排除 node_modules 和 .git）
          tar --exclude='.git' \
              --exclude='client/node_modules' \
              --exclude='client/dist' \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              -czf /tmp/ttssreport.tar.gz .
          
          echo "Package size: $(du -sh /tmp/ttssreport.tar.gz | cut -f1)"
          
          # 传输到服务器
          scp /tmp/ttssreport.tar.gz ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/ttssreport.tar.gz

      - name: Build and deploy on server
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          VOLCENGINE_SMS_ACCESS_KEY: ${{ secrets.VOLCENGINE_SMS_ACCESS_KEY }}
          VOLCENGINE_SMS_SECRET_KEY: ${{ secrets.VOLCENGINE_SMS_SECRET_KEY }}
          VOLCENGINE_SMS_SIGN_NAME: ${{ secrets.VOLCENGINE_SMS_SIGN_NAME }}
          VOLCENGINE_SMS_TEMPLATE_ID: ${{ secrets.VOLCENGINE_SMS_TEMPLATE_ID }}
        run: |
          # 写入 .env 文件到服务器
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "mkdir -p /root/ttssreport"
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "cat > /root/ttssreport/.env" << ENVEOF
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT:-3306}
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          DB_NAME=${DB_NAME}
          TUSHARE_TOKEN=${TUSHARE_TOKEN}
          JWT_SECRET_KEY=${JWT_SECRET_KEY}
          VOLCENGINE_SMS_ACCESS_KEY=${VOLCENGINE_SMS_ACCESS_KEY}
          VOLCENGINE_SMS_SECRET_KEY=${VOLCENGINE_SMS_SECRET_KEY}
          VOLCENGINE_SMS_SIGN_NAME=${VOLCENGINE_SMS_SIGN_NAME}
          VOLCENGINE_SMS_TEMPLATE_ID=${VOLCENGINE_SMS_TEMPLATE_ID}
          ENVEOF
          
          # 在服务器上解压代码并构建镜像
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash << 'SSHEOF'
            set -e
            echo "=== 解压代码 ==="
            mkdir -p /root/ttssreport/src
            tar -xzf /tmp/ttssreport.tar.gz -C /root/ttssreport/src
            rm -f /tmp/ttssreport.tar.gz
            
            echo "=== 构建后端镜像（使用国内 pip 镜像源）==="
            cd /root/ttssreport/src
            docker build \
              --build-arg PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/ \
              --build-arg PIP_TRUSTED_HOST=mirrors.aliyun.com \
              -f Dockerfile.backend \
              -t ttssreport-backend:latest \
              . 2>&1 | tail -20
            
            echo "=== 构建前端镜像 ==="
            docker build \
              -f Dockerfile \
              -t ttssreport-frontend:latest \
              . 2>&1 | tail -10
            
            echo "=== 写入 docker-compose.prod.yml ==="
            cat > /root/ttssreport/docker-compose.prod.yml << 'COMPOSEEOF'
          services:
            backend:
              image: ttssreport-backend:latest
              container_name: ttssreport-backend
              restart: unless-stopped
              env_file:
                - /root/ttssreport/.env
              ports:
                - "8000:8000"
              volumes:
                - backend_logs:/app/logs

            frontend:
              image: ttssreport-frontend:latest
              container_name: ttssreport-frontend
              restart: unless-stopped
              depends_on:
                - backend
              ports:
                - "80:80"

          volumes:
            backend_logs:
              driver: local
          COMPOSEEOF
            
            echo "=== 重启服务 ==="
            docker compose -f /root/ttssreport/docker-compose.prod.yml down --remove-orphans || true
            docker compose -f /root/ttssreport/docker-compose.prod.yml up -d
            
            echo "=== 清理旧镜像 ==="
            docker image prune -f
            
            echo "=== 服务状态 ==="
            docker compose -f /root/ttssreport/docker-compose.prod.yml ps
            
            echo "✅ 部署完成！"
          SSHEOF

      - name: Verify deployment
        run: |
          sleep 20
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.DEPLOY_HOST }}/ || echo "000")
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ 部署验证成功！"
          else
            echo "⚠️ HTTP 状态码: $HTTP_STATUS，请手动检查服务器"
          fi
