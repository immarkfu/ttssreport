name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'
  VOLCES_REGISTRY: ttssreport-cn-beijing.cr.volces.com
  VOLCES_NAMESPACE: ttssreport-1
  BACKEND_IMAGE: ttssreport-backend
  FRONTEND_IMAGE: ttssreport-frontend

jobs:
  # ─── 前端构建检查 ────────────────────────────────────────────────
  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (with Taobao registry)
        run: pnpm install --frozen-lockfile --registry https://registry.npmmirror.com

      - name: Type check
        run: pnpm run check

      - name: Build
        run: pnpm run build

  # ─── 后端依赖检查 ────────────────────────────────────────────────
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (with Aliyun mirror)
        run: |
          pip install --no-cache-dir \
            -i https://mirrors.aliyun.com/pypi/simple/ \
            --trusted-host mirrors.aliyun.com \
            -r requirements.txt

      - name: Run tests
        run: pytest test/ -v || echo "No tests found, skipping"
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

  # ─── 构建镜像并推送到火山云镜像仓库 ─────────────────────────────
  docker:
    name: Build & Push to Volces CR
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Volces Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.VOLCES_REGISTRY }}
          username: ${{ secrets.VOLCES_USERNAME }}
          password: ${{ secrets.VOLCES_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        timeout-minutes: 40
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ env.VOLCES_REGISTRY }}/${{ env.VOLCES_NAMESPACE }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.VOLCES_REGISTRY }}/${{ env.VOLCES_NAMESPACE }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        timeout-minutes: 10
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.VOLCES_REGISTRY }}/${{ env.VOLCES_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.VOLCES_REGISTRY }}/${{ env.VOLCES_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── SSH 部署到现网服务器 ────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Write compose file and deploy
        env:
          VOLCES_USERNAME: ${{ secrets.VOLCES_USERNAME }}
          VOLCES_PASSWORD: ${{ secrets.VOLCES_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          VOLCENGINE_SMS_ACCESS_KEY: ${{ secrets.VOLCENGINE_SMS_ACCESS_KEY }}
          VOLCENGINE_SMS_SECRET_KEY: ${{ secrets.VOLCENGINE_SMS_SECRET_KEY }}
          VOLCENGINE_SMS_SIGN_NAME: ${{ secrets.VOLCENGINE_SMS_SIGN_NAME }}
          VOLCENGINE_SMS_TEMPLATE_ID: ${{ secrets.VOLCENGINE_SMS_TEMPLATE_ID }}
        run: |
          # 通过 SSH 将 compose 文件和环境变量安全地写入服务器
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "mkdir -p /root/ttssreport"

          # 写入 .env 文件（敏感信息通过 SSH 管道传输，不落地到 CI 日志）
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "cat > /root/ttssreport/.env" << ENVEOF
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT:-3306}
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          DB_NAME=${DB_NAME}
          TUSHARE_TOKEN=${TUSHARE_TOKEN}
          JWT_SECRET_KEY=${JWT_SECRET_KEY}
          VOLCENGINE_SMS_ACCESS_KEY=${VOLCENGINE_SMS_ACCESS_KEY}
          VOLCENGINE_SMS_SECRET_KEY=${VOLCENGINE_SMS_SECRET_KEY}
          VOLCENGINE_SMS_SIGN_NAME=${VOLCENGINE_SMS_SIGN_NAME}
          VOLCENGINE_SMS_TEMPLATE_ID=${VOLCENGINE_SMS_TEMPLATE_ID}
          ENVEOF

          # 写入 docker-compose.prod.yml（无敏感信息，通过 env_file 引用）
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "cat > /root/ttssreport/docker-compose.prod.yml" << 'COMPOSEEOF'
          services:
            backend:
              image: ttssreport-cn-beijing.cr.volces.com/ttssreport-1/ttssreport-backend:latest
              container_name: ttssreport-backend
              restart: unless-stopped
              env_file:
                - /root/ttssreport/.env
              ports:
                - "8000:8000"
              volumes:
                - backend_logs:/app/logs

            frontend:
              image: ttssreport-cn-beijing.cr.volces.com/ttssreport-1/ttssreport-frontend:latest
              container_name: ttssreport-frontend
              restart: unless-stopped
              depends_on:
                - backend
              ports:
                - "80:80"

          volumes:
            backend_logs:
              driver: local
          COMPOSEEOF

          # 执行部署
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash << 'SSHEOF'
            set -e
            REGISTRY="ttssreport-cn-beijing.cr.volces.com"
            NAMESPACE="ttssreport-1"

            echo "=== 登录火山云镜像仓库 ==="
            # 从 .env 读取凭证（不在 CI 日志中暴露）
            source /root/ttssreport/.env 2>/dev/null || true
            echo "${VOLCES_PASSWORD:-}" | docker login ${REGISTRY} \
              -u "${VOLCES_USERNAME:-}" --password-stdin 2>/dev/null || true
          SSHEOF

          # 单独传入镜像仓库凭证用于 pull
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "echo '${VOLCES_PASSWORD}' | docker login ttssreport-cn-beijing.cr.volces.com -u '${VOLCES_USERNAME}' --password-stdin"

          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash << 'SSHEOF'
            set -e
            echo "=== 拉取最新镜像 ==="
            docker pull ttssreport-cn-beijing.cr.volces.com/ttssreport-1/ttssreport-backend:latest
            docker pull ttssreport-cn-beijing.cr.volces.com/ttssreport-1/ttssreport-frontend:latest

            echo "=== 重启服务 ==="
            docker compose -f /root/ttssreport/docker-compose.prod.yml down --remove-orphans || true
            docker compose -f /root/ttssreport/docker-compose.prod.yml up -d

            echo "=== 清理旧镜像 ==="
            docker image prune -f

            echo "=== 服务状态 ==="
            docker compose -f /root/ttssreport/docker-compose.prod.yml ps

            echo "✅ 部署完成！"
          SSHEOF

      - name: Verify deployment
        run: |
          sleep 20
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.DEPLOY_HOST }}/ || echo "000")
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ 部署验证成功！"
          else
            echo "⚠️ HTTP 状态码: $HTTP_STATUS，请手动检查服务器"
          fi
