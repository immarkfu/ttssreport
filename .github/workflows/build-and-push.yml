name: Build and Push to Volces CR

on:
  push:
    branches: [ main ]  # 代码推送到main分支时触发
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 登录火山云镜像仓库
      - name: Login to Volces Container Registry
        uses: docker/login-action@v3
        with:
          registry: ttssreport-cn-beijing.cr.volces.com
          username: ${{ secrets.VOLCES_USERNAME }}
          password: ${{ secrets.VOLCES_PASSWORD }}

      # 构建并推送镜像到火山云
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 替换这里的 [镜像名] 为你在火山云创建的OCI仓库名称（比如openclaw）
          tags: ttssreport-cn-beijing.cr.volces.com/ttssreport-1/ttssreport-1:latest
